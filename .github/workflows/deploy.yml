name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to 72.56.12.132
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 72.56.12.132
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script_stop: true
          script: |
            if [ ! -d /opt/openmmes/.git ]; then
              mkdir -p /opt/openmmes
              git clone https://github.com/lostoneast/OpenMes.git /opt/openmmes
            fi
            cd /opt/openmmes
            export HTTP_PORT=8080
            export HTTPS_PORT=8443
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build
            STATUS=""
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)
              echo "Health check attempt $i => HTTP $STATUS"
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
                break
              fi
              sleep 5
            done
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
              echo "Deployment verification failed after retries!"
              exit 1
            fi
            echo "Deployment successful!"
